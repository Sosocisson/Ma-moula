:root{
  --accent:#5B4FE9; --accent-ink:#fff;
  --bg:#F4F3F8; --surface:#FFFFFF; --surface2:#F7F6FB; --line:rgba(20,16,50,.09);
  --text:#17142B; --muted:#6E6A85; --good:#1E9E5A; --bad:#E0483E;
  --radius:18px; --shadow:0 1px 2px rgba(20,16,50,.05),0 8px 24px -12px rgba(20,16,50,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fs:16px; --side:270px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
[data-theme=dark]{
  --bg:#0F0E17; --surface:#1A1926; --surface2:#232233; --line:rgba(255,255,255,.08);
  --text:#F2F0FA; --muted:#A09CB8; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs);line-height:1.4;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:calc(18px + var(--safe-t)) 14px 24px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#ff7aa2));display:grid;place-items:center;color:#fff;font-weight:800}
.brand b{font-size:1.08em}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--text);text-decoration:none;font-weight:600;cursor:pointer}
.nav a svg{width:21px;height:21px;opacity:.75}
.nav a.on{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
.nav a.on svg{opacity:1}
.folders{margin-top:20px}
.folders .lbl{font-size:.75em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 12px 8px;font-weight:700}
.year{border-radius:12px}
.year>button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:12px;font-weight:700}
.year>button .chev{margin-left:auto;transition:transform .2s;opacity:.5}
.year.open>button .chev{transform:rotate(90deg)}
.year .months{display:none;padding:2px 0 8px 22px}
.year.open .months{display:block}
.months a{display:flex;justify-content:space-between;padding:7px 12px;border-radius:10px;font-size:.93em;cursor:pointer;color:var(--text)}
.months a span:last-child{color:var(--muted);font-size:.88em}
.months a.on{background:var(--surface2);font-weight:700;color:var(--accent)}
.sync{margin:18px 8px 0;font-size:.78em;color:var(--muted);display:flex;gap:8px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.cloud i{background:var(--good)}

/* ---------- main ---------- */
.main{padding:calc(22px + var(--safe-t)) 28px 120px;max-width:1280px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:1.9em}
.top .sp{flex:1}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;border-radius:11px;font-size:.9em}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g32{grid-template-columns:3fr 2fr}
@media (max-width:1320px){ .g32{grid-template-columns:1fr} }
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card h3{font-size:1.02em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.kpi .k{font-size:.82em;color:var(--muted);font-weight:600}
.kpi .v{font-size:1.65em;font-weight:750;letter-spacing:-.02em;margin-top:4px}
.kpi .d{font-size:.8em;margin-top:4px}
.kpi.accent{background:var(--accent);color:var(--accent-ink)}
.kpi.accent .k,.kpi.accent .d{color:color-mix(in srgb,var(--accent-ink) 78%,transparent)}
.insight{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:16px;margin-top:16px;
  background:color-mix(in srgb,var(--c,#3A87FE) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c,#3A87FE) 25%,transparent)}
.insight .ic{width:40px;height:40px;border-radius:12px;background:var(--c);display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.sec{margin-top:16px}

.legend{display:flex;flex-direction:column;gap:2px}
.legend .row{display:grid;grid-template-columns:14px minmax(0,1fr) auto 64px;gap:10px;align-items:center;padding:8px 6px;border-radius:10px;cursor:pointer}
.legend .row:hover,.legend .row.on{background:var(--surface2)}
.legend .row.off{opacity:.35}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.legend .amt{font-weight:700}
.delta{font-size:.78em;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface2);min-width:56px;text-align:center}
.delta.up{color:var(--bad)} .delta.down{color:var(--good)}
.donutwrap{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:center}

.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.budget{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-bottom:12px}
.budget .bar{grid-column:1/-1}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.78em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pivot td,.pivot th{font-size:.88em;padding:8px 7px}
.pivot tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.pivot td:first-child{position:sticky;left:0;background:var(--surface)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:.88em;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.search{max-width:240px;min-height:36px;padding:6px 12px;border-radius:999px}

.day{margin-top:10px}
.day .dh{font-size:.78em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 4px;display:flex;justify-content:space-between}
.tx{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:11px 10px;border-radius:12px;cursor:pointer}
.tx:hover{background:var(--surface2)}
.tx .stripe{align-self:stretch;border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
.tx .stripe i{display:block}
.tx .lb{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .meta{font-size:.8em;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:.92em;background:var(--surface2)}
.tx .am{font-weight:750}
.tx.in .am{color:var(--good)}
.tx.vir{opacity:.6}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.mtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mtile{background:var(--surface2);border-radius:14px;padding:12px 14px;cursor:pointer;border:1px solid transparent}
.mtile:hover{border-color:var(--accent)}
.mtile .t{font-weight:700;font-size:.92em}
.mtile .v{font-weight:800;font-size:1.15em;margin:4px 0 8px}
.mtile .stack{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--line)}
.seg{display:inline-flex;background:var(--surface2);border-radius:13px;padding:3px;border:1px solid var(--line)}
.seg button{padding:8px 14px;border-radius:10px;font-weight:600;font-size:.92em;min-height:38px}
.seg button.on{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row2>*{flex:1;min-width:140px}
svg text{font-family:var(--font)}

/* ---------- FAB ---------- */
.fab{position:fixed;right:28px;bottom:calc(28px + var(--safe-b));width:66px;height:66px;border-radius:22px;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 14px 30px -8px color-mix(in srgb,var(--accent) 70%,transparent);display:grid;place-items:center;z-index:20}
.fab svg{width:30px;height:30px}

/* ---------- sheet (entry) ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,12,35,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet{background:var(--surface);border-radius:26px;width:min(980px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:up .22s}
.sheet.narrow{width:min(620px,100%)}
.sh-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.sh-h h2{font-size:1.15em;flex:1;text-align:center}
.sh-b{padding:20px 22px;display:grid;grid-template-columns:1fr 300px;gap:24px}
.sh-b.one{grid-template-columns:1fr}
.amount{font-size:2.6em;font-weight:800;letter-spacing:-.03em;padding:10px 16px;border-radius:16px;border:2px solid transparent;background:var(--surface2);cursor:pointer;display:flex;align-items:baseline;gap:6px}
.amount.focus{border-color:var(--accent)}
.amount small{font-size:.42em;color:var(--muted);font-weight:600}
.lbl2{font-size:.78em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.93em}
.cat.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));box-shadow:inset 0 0 0 1px var(--c)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:34px}
.sugg button{padding:6px 11px;border-radius:999px;background:var(--surface2);font-size:.86em;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.splits{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.spl{display:grid;grid-template-columns:auto 1fr auto 36px;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--surface2);border:2px solid transparent;cursor:pointer}
.spl.focus{border-color:var(--accent)}
.spl .v{font-weight:800;font-size:1.2em;min-width:90px;text-align:right}
.spl.rest{background:transparent;border:1.5px dashed var(--line);cursor:default}
.spl select{min-height:36px;padding:4px 8px;width:auto}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
.keypad button{height:62px;border-radius:16px;background:var(--surface2);font-size:1.5em;font-weight:650}
.keypad button:active{transform:scale(.96);background:color-mix(in srgb,var(--accent) 18%,var(--surface2))}
.keypad .ok{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);font-size:1.1em}
.sh-f{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.sh-f .sp{flex:1}
.err{color:var(--bad);font-weight:600;font-size:.9em;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;z-index:90;animation:up .2s}

/* settings */
.set-row{display:grid;grid-template-columns:44px 1fr 150px 120px 40px 40px 40px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.swatch{width:40px;height:40px;border-radius:12px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.swatch input{position:absolute;inset:-10px;width:70px;height:70px;opacity:0;cursor:pointer;padding:0;border:0}
.palette{display:flex;gap:8px;flex-wrap:wrap}
.palette button{width:34px;height:34px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.palette button.on{outline:3px solid var(--text);outline-offset:2px}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fonts button{padding:14px;border-radius:14px;border:1.5px solid var(--line);text-align:left;background:var(--surface)}
.fonts button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fonts button b{display:block;font-size:1.3em;margin-bottom:2px}
.fonts button span{font-size:.8em;color:var(--muted)}
.checks label{display:grid;grid-template-columns:28px 1fr 120px;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.checks input[type=checkbox]{width:22px;height:22px;min-height:0}
.checks input[type=text]{min-height:38px;text-align:right}

/* ---------- responsive ---------- */
.mobilebar{display:none}
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,1fr)} .mtiles{grid-template-columns:repeat(3,1fr)} .g32{grid-template-columns:1fr} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:calc(16px + var(--safe-t)) 16px calc(110px + var(--safe-b))}
  .mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));z-index:30}
  .mobilebar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7em;font-weight:600;color:var(--muted);padding:6px;cursor:pointer}
  .mobilebar a svg{width:22px;height:22px}
  .mobilebar a.on{color:var(--accent)}
  .fab{bottom:calc(84px + var(--safe-b));right:18px}
  .g2,.donutwrap{grid-template-columns:1fr}
  .donutwrap svg{max-width:240px;margin:auto}
  .sh-b{grid-template-columns:1fr}
  .mtiles{grid-template-columns:repeat(2,1fr)}
  .set-row{grid-template-columns:44px 1fr 40px 40px;grid-template-areas:none}
  .set-row .hide-m{display:none}
  .top h1{font-size:1.5em}
}
@media (max-width:520px){ .g4{grid-template-columns:1fr 1fr} .kpi .v{font-size:1.3em} .overlay{padding:0;align-items:flex-end} .sheet{border-radius:24px 24px 0 0;max-height:94vh} }

[data-theme=dark] .dot{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
</style>
</head>

<script>/* ================= Mes Comptes — données, calculs, stockage ================= */
'use strict';
const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MOIS_C = ['Janv.','Févr.','Mars','Avr.','Mai','Juin','Juil.','Août','Sept.','Oct.','Nov.','Déc.'];
const KINDS = {depense:'Dépense', epargne:'Épargne', revenu:'Revenu', virement:'Virement interne'};

const DEFAULT_CATS = [
  {id:'alim',     name:'Alimentation',              color:'#ED7D31', kind:'depense', budget:0},
  {id:'evit',     name:'Nourriture évitable',       color:'#3A87FE', kind:'depense', budget:0},
  {id:'copain',   name:'Pour Guigui',               color:'#C552F5', kind:'depense', budget:0},
  {id:'oblig',    name:'Frais obligatoires',        color:'#F2B705', kind:'depense', budget:0},
  {id:'autre',    name:'Déco, entretien, cadeaux',  color:'#2B2A33', kind:'depense', budget:0},
  {id:'transport',name:'Transport & voiture',       color:'#4CB782', kind:'depense', budget:0},
  {id:'maison',   name:'Maison & travaux',          color:'#A1714F', kind:'depense', budget:0},
  {id:'sante',    name:'Santé',                     color:'#E5484D', kind:'depense', budget:0},
  {id:'loisirs',  name:'Loisirs & sorties',         color:'#EC6BB5', kind:'depense', budget:0},
  {id:'epargne',  name:'Épargne',                   color:'#12A4B5', kind:'epargne', budget:0},
  {id:'revenu',   name:'Revenus',                   color:'#1E9E5A', kind:'revenu',  budget:0},
  {id:'virement', name:'Virement entre comptes',    color:'#9A98A8', kind:'virement',budget:0},
];
const DEFAULT_ACCS = [
  {id:'euro', name:'Eurocompte', color:'#0A84FF'},
  {id:'bleu', name:'Livret bleu', color:'#5E5CE6'},
  {id:'pm', name:'Porte-monnaie', color:'#FF9F0A'},
  {id:'lep', name:'Livret LEP', color:'#30B0C7'},
  {id:'tr', name:'Trade Republic', color:'#34C759'},
  {id:'pel', name:'PEL', color:'#64D2FF'},
  {id:'commun', name:'Compte commun (Revolut)', color:'#BF5AF2'},
  {id:'revperso', name:'Revolut perso', color:'#FF375F'},
];
const DEFAULT_SETTINGS = {font:'system', fontScale:1, accent:'#5B4FE9', theme:'auto', defaultAcc:'euro', restCat:'autre'};

const FONTS = [
  {id:'system',  name:'Système',      stack:'-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif'},
  {id:'rounded', name:'Arrondie',     stack:'ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif'},
  {id:'serif',   name:'Élégante',     stack:'ui-serif,"New York",Georgia,"Times New Roman",serif'},
  {id:'mono',    name:'Machine',      stack:'ui-monospace,"SF Mono",Menlo,Consolas,monospace'},
  {id:'Inter',   name:'Inter',   stack:'"Inter",-apple-system,system-ui,sans-serif'},
  {id:'DM Sans', name:'DM Sans', stack:'"DM Sans",-apple-system,system-ui,sans-serif'},
  {id:'Poppins', name:'Poppins', stack:'"Poppins",-apple-system,system-ui,sans-serif'},
];
const PALETTE = ['#ED7D31','#FF5A4F','#E5484D','#EC6BB5','#C552F5','#8E6CF0','#5B4FE9','#3A87FE','#12A4B5','#4CB782','#1E9E5A','#A3C93A','#F2B705','#A1714F','#6E6A85','#2B2A33'];

/* ---------- state ---------- */
let S = blank();
function blank(){ return {v:1, settings:{...DEFAULT_SETTINGS}, cats:DEFAULT_CATS.map(c=>({...c})), accs:DEFAULT_ACCS.map(a=>({...a})), months:{}, tx:[]}; }

/* ---------- utils ---------- */
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const keyOf = iso => iso.slice(0,7);
const yearOf = k => +k.slice(0,4), monOf = k => +k.slice(5,7);
const mkey = (y,m) => { while(m<1){m+=12;y--} while(m>12){m-=12;y++} return `${y}-${pad(m)}`; };
const prevKey = k => mkey(yearOf(k), monOf(k)-1);
const nextKey = k => mkey(yearOf(k), monOf(k)+1);
const monthName = k => `${MOIS[monOf(k)-1]} ${yearOf(k)}`;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2 = v => Math.round(v*100)/100;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const NF0 = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fmt = v => NF.format(v||0);
const fmt0 = v => NF0.format(v||0);
const fmtK = v => Math.abs(v)>=1000 ? (Math.round(v/100)/10).toString().replace('.',',')+' k€' : Math.round(v)+' €';
const parseNum = s => { const v=parseFloat(String(s).replace(/\s/g,'').replace(',','.')); return isFinite(v)?v:0; };
const numStr = v => (Math.round(v*100)/100).toString().replace('.',',');
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
function cleanLabel(l){ return String(l).replace(/[\d]+([.,]\d+)?/g,' ').replace(/[+€;:,.()\/-]/g,' ').replace(/\s+/g,' ').trim().replace(/^./,c=>c.toUpperCase()) || String(l).trim(); }
function luminance(hex){ const n=parseInt(hex.slice(1),16); const r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255; return .2126*r+.7152*g+.0722*b; }

const cat = id => S.cats.find(c=>c.id===id) || {id, name:id, color:'#999', kind:'depense'};
const acc = id => S.accs.find(a=>a.id===id) || {id, name:id, color:'#999'};
const depCats = () => S.cats.filter(c=>c.kind==='depense');

/* ---------- index & caches ---------- */
let IDX=null, MEMO={};
function invalidate(){ IDX=null; MEMO={}; }
function idx(){
  if(IDX) return IDX;
  IDX = {byMonth:{}, keys:new Set(Object.keys(S.months))};
  for(const t of S.tx){ const k=keyOf(t.date); (IDX.byMonth[k] ||= []).push(t); IDX.keys.add(k); }
  IDX.keys.add(keyOf(todayISO()));
  IDX.sorted = [...IDX.keys].sort();
  return IDX;
}
const txOf = (k, accF) => (idx().byMonth[k]||[]).filter(t=>!accF || accF.includes(t.acc));
function txOfYear(y, accF){ let out=[]; for(let m=1;m<=12;m++) out=out.concat(txOf(mkey(y,m),accF)); return out; }
function allYears(){ return [...new Set(idx().sorted.map(yearOf))].sort((a,b)=>b-a); }

/* sums: dep = dépenses (catégories "dépense"), rev = revenus, epa = épargne */
function sums(list){
  const by={}; let dep=0, rev=0, epa=0, vir=0, inAll=0, outAll=0;
  for(const t of list){
    if(t.dir==='in') inAll+=t.amount; else outAll+=t.amount;
    for(const s of t.splits){
      const c=cat(s.cat);
      let v = s.amount;
      if(c.kind==='revenu'){ v = t.dir==='in'? v : -v; rev+=v; }
      else { v = t.dir==='out'? v : -v; if(c.kind==='depense') dep+=v; else if(c.kind==='epargne') epa+=v; else vir+=v; }
      by[s.cat]=(by[s.cat]||0)+v;
    }
  }
  return {by, dep:r2(dep), rev:r2(rev), epa:r2(epa), vir:r2(vir), reste:r2(rev-dep-epa), inAll:r2(inAll), outAll:r2(outAll)};
}
function monthSums(k, accF){ const key='ms|'+k+'|'+(accF||''); return MEMO[key] ||= sums(txOf(k,accF)); }

/* soldes de comptes : début (saisi ou reporté du mois précédent) → fin */
function opening(k, a){
  const m=S.months[k];
  if(m && m.openings && m.openings[a]!=null) return m.openings[a];
  const first = idx().sorted[0];
  if(!first || k<=first) return 0;
  return closing(prevKey(k), a);
}
function closing(k, a){
  const key='cl|'+k+'|'+a; if(MEMO[key]!=null) return MEMO[key];
  let v = opening(k,a);
  for(const t of txOf(k,[a])) v += t.dir==='in'? t.amount : -t.amount;
  return MEMO[key]=r2(v);
}

/* libellés connus → suggestions */
function labelIndex(){
  if(MEMO.labels) return MEMO.labels;
  const map={};
  const recent=[...S.tx].sort((a,b)=>a.date<b.date?-1:1);
  for(const t of recent){
    const k=cleanLabel(t.label).toLowerCase(); if(!k) continue;
    const e = map[k] ||= {label:cleanLabel(t.label), n:0, dir:t.dir, cats:{}};
    e.n++; e.dir=t.dir; e.acc=t.acc; e.amount=t.amount; e.last=t.date;
    const main=[...t.splits].sort((a,b)=>b.amount-a.amount)[0]; if(main) e.cats[main.cat]=(e.cats[main.cat]||0)+1;
  }
  for(const e of Object.values(map)) e.cat = Object.entries(e.cats).sort((a,b)=>b[1]-a[1])[0]?.[0];
  return MEMO.labels = Object.values(map);
}

/* ================= STOCKAGE ================= */
const LS_KEY='mesComptes.v1';
const Store = {status:'Enregistré sur cet appareil'};
function loadLocal(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const d=JSON.parse(raw); if(d && d.tx) S=normalize(d); } }catch(e){ console.warn(e); }
}
function normalize(d){
  const b=blank();
  const out={v:1, settings:{...b.settings, ...(d.settings||{})}, cats:d.cats&&d.cats.length?d.cats:b.cats, accs:d.accs&&d.accs.length?d.accs:b.accs, months:d.months||{}, tx:d.tx||[]};
  // garantit les catégories système
  for(const c of b.cats) if(!out.cats.find(x=>x.id===c.id)) out.cats.push({...c});
  return out;
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ toast('Stockage local plein : exporte une sauvegarde'); } mirrorIDB(); }

/* marque ce qui a changé ; tout est enregistré localement (localStorage + copie IndexedDB) */
function changed(...keys){
  invalidate();
  saveLocal();
}
/* copie de secours dans IndexedDB (au cas où localStorage serait vidé par iOS) */
const IDB={
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('mesComptes',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async put(v){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,LS_KEY); t.oncomplete=()=>{db.close();res();}; t.onerror=()=>{db.close();rej(t.error);}; }); },
  async get(){ const db=await this.open(); return new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(LS_KEY); q.onsuccess=()=>{db.close();res(q.result);}; q.onerror=()=>{db.close();rej(q.error);}; }); }
};
let _idbT=null;
function mirrorIDB(){ if(!window.indexedDB) return; clearTimeout(_idbT); _idbT=setTimeout(()=>{ IDB.put(JSON.stringify(S)).catch(()=>{}); },400); }
async function restoreIDB(){
  try{
    if(!window.indexedDB || localStorage.getItem(LS_KEY)) return;
    const raw=await IDB.get(); if(!raw) return;

async function autoImport(){

/* ---------- import / export ---------- */
function importData(d, mode){
  if(!d || !Array.isArray(d.tx)) throw new Error('Fichier non reconnu');
  if(mode==='replace'){ S.tx=[]; S.months={}; }
  const ids=new Set(S.tx.map(t=>t.id)); let n=0;
  for(const t of d.tx){ if(!ids.has(t.id)){ S.tx.push(t); ids.add(t.id); n++; } }
  for(const [k,m] of Object.entries(d.months||{})){ S.months[k]={openings:{...(S.months[k]?.openings||{}), ...(m.openings||{})}}; }
  for(const a of (d.accounts||d.accs||[])) if(!S.accs.find(x=>x.id===a.id)) S.accs.push({id:a.id,name:a.name,color:a.color||'#888'});
  if(d.cats) for(const c of d.cats){ const e=S.cats.find(x=>x.id===c.id); if(e) Object.assign(e,c); else S.cats.push(c); }
  if(d.settings) S.settings={...S.settings,...d.settings};
  invalidate();
  changed('meta', ...Object.keys(idx().byMonth), ...Object.keys(S.months));
  return n;
}
function exportJSON(){ return JSON.stringify({app:'mes-comptes', version:1, exportedAt:new Date().toISOString(), settings:S.settings, cats:S.cats, accs:S.accs, months:S.months, tx:S.tx}); }

'use strict';
function chartTheme(forPdf){
  if(forPdf) return {fg:'#17142B', muted:'#6E6A85', grid:'#E6E4EE', bg:'#FFFFFF', font:'Helvetica, Arial, sans-serif'};
  const cs=getComputedStyle(document.body);
  return {fg:cs.getPropertyValue('--text').trim()||'#17142B', muted:cs.getPropertyValue('--muted').trim()||'#6E6A85', grid:cs.getPropertyValue('--line').trim()||'#e5e5ee', bg:cs.getPropertyValue('--surface').trim()||'#fff', font:'inherit'};
}
function niceMax(v){ if(v<=0) return 10; const p=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if(m*p>=v) return m*p; return 10*p; }
function dc(col, pdf){ return (!pdf && document.documentElement.dataset.theme==='dark' && luminance(col)<.09) ? '#7D7A92' : col; }
const svgEsc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* Anneau : items [{label,value,color}] */
function donutSVG(items, {size=220, thick=34, center='', sub='', pdf=false}={}){
  const T=chartTheme(pdf), r=(size-thick)/2, C=2*Math.PI*r, tot=items.reduce((s,i)=>s+Math.max(0,i.value),0);
  let off=0, arcs='';
  if(tot<=0) arcs=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${T.grid}" stroke-width="${thick}"/>`;
  else for(const it of items){ const v=Math.max(0,it.value); if(!v) continue; const len=v/tot*C; const gap=items.length>1?Math.min(2,len/3):0;
    arcs+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${dc(it.color,pdf)}" stroke-width="${thick}" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`; off+=len; }
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width:${size}px;display:block">${arcs}
    <text x="50%" y="${size/2-4}" text-anchor="middle" font-family="${T.font}" font-size="${size*.105}" font-weight="800" fill="${T.fg}">${svgEsc(center)}</text>
    <text x="50%" y="${size/2+size*.085}" text-anchor="middle" font-family="${T.font}" font-size="${size*.058}" fill="${T.muted}">${svgEsc(sub)}</text></svg>`;
}

/* Barres empilées : labels[], series[{name,color,values[]}], line optionnelle {values,color,name} */
function stackedSVG(labels, series, {w=900, h=300, line=null, pdf=false, keys=null}={}){
  const T=chartTheme(pdf), padL=54, padR=12, padT=14, padB=30, iw=w-padL-padR, ih=h-padT-padB, n=labels.length;
  const totals=labels.map((_,i)=>series.reduce((s,se)=>s+Math.max(0,se.values[i]||0),0));
  const mx=niceMax(Math.max(...totals, ...(line?line.values:[0]), 1));
  const bw=Math.min(46, iw/n*.62), step=iw/n;
  let g='';
  for(let t=0;t<=4;t++){ const y=padT+ih-ih*t/4, v=mx*t/4; g+=`<line x1="${padL}" x2="${w-padR}" y1="${y}" y2="${y}" stroke="${T.grid}" stroke-width="1"/><text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="11" fill="${T.muted}" font-family="${T.font}">${svgEsc(fmtK(v))}</text>`; }
  let bars='';
  labels.forEach((lb,i)=>{
    const x=padL+step*i+(step-bw)/2; let y=padT+ih;
    const segs=series.filter(se=>(se.values[i]||0)>0);
    segs.forEach((se,j)=>{ const hh=se.values[i]/mx*ih; y-=hh; const top=j===segs.length-1; bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,hh-(top?0:1))}" fill="${dc(se.color,pdf)}" rx="${top?4:0}"/>`; });
    if(totals[i]>0) bars+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${T.fg}" font-family="${T.font}">${svgEsc(fmtK(totals[i]))}</text>`;
    bars+=`<text x="${x+bw/2}" y="${h-10}" text-anchor="middle" font-size="11" fill="${T.muted}" font-family="${T.font}">${svgEsc(lb)}</text>`;
    if(keys) bars+=`<rect x="${padL+step*i}" y="${padT}" width="${step}" height="${ih+padB}" fill="transparent" data-act="goMonth" data-k="${keys[i]}" style="cursor:pointer"/>`;
  });
  let ln='';
  if(line){ const pts=line.values.map((v,i)=>v>0?[padL+step*i+step/2, padT+ih-(v/mx)*ih]:null).filter(Boolean);
    ln=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${line.color}" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${line.color}"/>`).join(''); }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block">${g}${bars}${ln}</svg>`;
}

/* Courbes : labels[], series[{name,color,values[] (null = trou)}] */
function linesSVG(labels, series, {w=900, h=280, pdf=false, area=false}={}){
  const T=chartTheme(pdf), padL=54, padR=16, padT=16, padB=30, iw=w-padL-padR, ih=h-padT-padB, n=labels.length;
  const all=series.flatMap(s=>s.values.filter(v=>v!=null)); const mx=niceMax(Math.max(1,...all));
  const X=i=> padL + (n<=1? iw/2 : iw*i/(n-1)), Y=v=> padT+ih-(v/mx)*ih;
  let g='';
  for(let t=0;t<=4;t++){ const y=padT+ih-ih*t/4; g+=`<line x1="${padL}" x2="${w-padR}" y1="${y}" y2="${y}" stroke="${T.grid}"/><text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="11" fill="${T.muted}" font-family="${T.font}">${svgEsc(fmtK(mx*t/4))}</text>`; }
  const every=Math.ceil(n/14);
  labels.forEach((lb,i)=>{ if(i%every===0) g+=`<text x="${X(i)}" y="${h-10}" text-anchor="middle" font-size="11" fill="${T.muted}" font-family="${T.font}">${svgEsc(lb)}</text>`; });
  let p='';
  for(const s of series){
    let d='', started=false;
    s.values.forEach((v,i)=>{ if(v==null){started=false;return;} d+=(started?'L':'M')+X(i)+','+Y(v)+' '; started=true; });
    if(area && series.length===1){ const idxs=s.values.map((v,i)=>v==null?null:i).filter(i=>i!=null); if(idxs.length) p+=`<path d="${d} L${X(idxs.at(-1))},${padT+ih} L${X(idxs[0])},${padT+ih} Z" fill="${s.color}" opacity=".12"/>`; }
    p+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.6}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(n<=24) s.values.forEach((v,i)=>{ if(v!=null) p+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.2" fill="${s.color}"/>`; });
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block">${g}${p}</svg>`;
}

/* Barres horizontales A vs B : rows[{label,color,a,b}] */
function compareSVG(rows, {w=900, la='A', lb='B', pdf=false}={}){
  const T=chartTheme(pdf), rowH=46, padL=190, padR=90, h=rows.length*rowH+30, iw=w-padL-padR;
  const mx=niceMax(Math.max(1,...rows.flatMap(r=>[r.a,r.b])));
  let s=`<text x="${padL}" y="14" font-size="12" font-weight="700" fill="${T.fg}" font-family="${T.font}">■ ${svgEsc(la)}</text><text x="${padL+200}" y="14" font-size="12" font-weight="700" fill="${T.muted}" font-family="${T.font}">▧ ${svgEsc(lb)}</text>`;
  rows.forEach((r,i)=>{ const y=28+i*rowH;
    s+=`<rect x="0" y="${y+6}" width="12" height="12" rx="3" fill="${r.color}"/><text x="20" y="${y+17}" font-size="13" font-weight="600" fill="${T.fg}" font-family="${T.font}">${svgEsc(r.label.length>24?r.label.slice(0,23)+'…':r.label)}</text>`;
    s+=`<rect x="${padL}" y="${y}" width="${Math.max(1,r.a/mx*iw)}" height="15" rx="4" fill="${dc(r.color,pdf)}"/>`;
    s+=`<rect x="${padL}" y="${y+19}" width="${Math.max(1,r.b/mx*iw)}" height="15" rx="4" fill="${dc(r.color,pdf)}" opacity=".35"/>`;
    s+=`<text x="${padL+Math.max(1,r.a/mx*iw)+6}" y="${y+12}" font-size="11.5" font-weight="700" fill="${T.fg}" font-family="${T.font}">${svgEsc(fmt0(r.a))}</text>`;
    s+=`<text x="${padL+Math.max(1,r.b/mx*iw)+6}" y="${y+31}" font-size="11.5" fill="${T.muted}" font-family="${T.font}">${svgEsc(fmt0(r.b))}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block">${s}</svg>`;
}

/* SVG → PNG (pour le PDF) */
function svgToPng(svg, w, h, scale=2){
  return new Promise((res,rej)=>{
    let s = svg.replace(/width="100%"/,`width="${w}" height="${h}"`).replace(/style="[^"]*"/,'');
    s = s.replace(/[  ]/g,' ');
    const img=new Image();
    img.onload=()=>{ const c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/png')); };
    img.onerror=rej;
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
  });
}

function accountsCard(k){
  const rows=S.accs.filter(a=>!a.hidden && (!V.accF||V.accF.includes(a.id))).map(a=>{
    const list=txOf(k,[a.id]); const o=opening(k,a.id), c=closing(k,a.id);
    const inn=r2(list.filter(t=>t.dir==='in').reduce((s,t)=>s+t.amount,0)), out=r2(list.filter(t=>t.dir==='out').reduce((s,t)=>s+t.amount,0));
    if(!list.length && !o && !c) return '';
    return `<tr><td><span class="dot" style="background:${a.color}"></span> ${esc(a.name)}</td><td class="n"><button class="chip" data-act="editOpening" data-a="${a.id}" title="Modifier le solde de début">${fmt(o)}</button></td><td class="n good">${inn?'+'+fmt(inn):''}</td><td class="n">${out?'−'+fmt(out):''}</td><td class="n"><b class="${c<0?'bad':''}">${fmt(c)}</b></td></tr>`;
  }).join('');
  return `<h3>Comptes</h3><div class="scroll"><table><thead><tr><th>Compte</th><th class="n">Début</th><th class="n">Entrées</th><th class="n">Sorties</th><th class="n">Fin</th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="muted">Aucun mouvement</td></tr>`}</tbody></table></div>`;
}
function budgetsCard(ms){
  const b=depCats().filter(c=>c.budget>0); if(!b.length) return `<p class="muted" style="font-size:.85em;margin:16px 0 0">Astuce : fixe un budget mensuel par catégorie dans Réglages pour suivre ta progression ici.</p>`;
  return `<h3 style="margin-top:20px">Budgets du mois</h3>`+b.map(c=>{ const v=ms.by[c.id]||0, p=Math.min(100,v/c.budget*100);
    return `<div class="budget"><span><span class="dot" style="background:${c.color}"></span> ${esc(c.name)}</span><span class="${v>c.budget?'bad':'muted'}"><b>${fmt0(v)}</b> / ${fmt0(c.budget)}</span><div class="bar"><i style="width:${p}%;background:${v>c.budget?'var(--bad)':c.color}"></i></div></div>`; }).join('');
}
function txList(k){
  let list=txOf(k,V.accF);
  if(V.catF) list=list.filter(t=>t.splits.some(s=>s.cat===V.catF));
  if(V.q){ const q=V.q.toLowerCase(); list=list.filter(t=>t.label.toLowerCase().includes(q) || acc(t.acc).name.toLowerCase().includes(q)); }
  if(!list.length) return `<div class="empty">Rien à afficher.</div>`;
  list=[...list].sort((a,b)=> a.date===b.date ? 0 : a.date<b.date?1:-1);
  const groups={}; for(const t of list) (groups[t.date] ||= []).push(t);
  const multiAcc = new Set(list.map(t=>t.acc)).size>1;
  return Object.entries(groups).map(([d,ts])=>{
    const dt=new Date(d+'T12:00:00'); const lab=dt.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    const tot=r2(ts.reduce((s,t)=>s+(t.dir==='out'&&!t.splits.every(x=>cat(x.cat).kind==='virement')?t.amount:0),0));
    return `<div class="day"><div class="dh"><span>${lab}</span><span>${tot?'−'+fmt(tot):''}</span></div>${ts.map(t=>txRow(t,multiAcc)).join('')}</div>`;
  }).join('');
}
function txRow(t, showAcc){
  const vir=t.splits.every(s=>cat(s.cat).kind==='virement');
  const tot=t.splits.reduce((s,x)=>s+x.amount,0)||1;
  const stripe=t.splits.map(s=>`<i style="background:${cat(s.cat).color};flex:${s.amount/tot}"></i>`).join('');
  const pills = t.splits.length>1 ? t.splits.map(s=>`<span class="pill"><span class="dot" style="background:${cat(s.cat).color}"></span>${fmt(s.amount)}</span>`).join('') : `<span>${esc(cat(t.splits[0]?.cat).name)}</span>`;
  return `<div class="tx ${t.dir} ${vir?'vir':''}" data-act="editTx" data-id="${t.id}"><div class="stripe">${stripe}</div>
    <div style="min-width:0"><div class="lb">${esc(t.label)}</div><div class="meta">${pills}${showAcc?`<span>· ${esc(acc(t.acc).name)}</span>`:''}</div></div>
    <div class="am">${t.dir==='in'?'+':'−'}${fmt(t.amount)}</div></div>`;
}

function viewYear(){
  const y=V.y, A=V.accF, ys=sumsYear(y,A);
  const nowK=keyOf(todayISO()); const lastM = y===yearOf(nowK)? monOf(nowK) : 12;
  let prevPer={dep:0,rev:0,epa:0}; for(let m=1;m<=lastM;m++){ const s=monthSums(mkey(y-1,m),A); prevPer.dep+=s.dep; prevPer.rev+=s.rev; prevPer.epa+=s.epa; }
  const active=[...Array(12)].map((_,i)=>mkey(y,i+1)).filter(k=>(idx().byMonth[k]||[]).length).length || 1;
  const keys=[...Array(12)].map((_,i)=>mkey(y,i+1));
  const cats=depCats().filter(c=>!V.hidden.has(c.id));
  const series=cats.map(c=>({name:c.name,color:c.color,values:keys.map(k=>Math.max(0,monthSums(k,A).by[c.id]||0))}));
  const years=allYears();
  return `
  <div class="top"><h1>Bilan ${y}</h1><span class="sp"></span>
    <div class="seg">${years.slice().reverse().map(yy=>`<button class="${yy===y?'on':''}" data-act="goYear" data-y="${yy}">${yy}</button>`).join('')}</div>
    <button class="btn" data-act="pdf" data-kind="year">${I.pdf}PDF</button></div>
  ${accFilterChips()}
  <div class="grid g4">
    <div class="card kpi accent"><div class="k">Dépenses ${y}</div><div class="v">${fmt0(ys.dep)}</div><div class="d">${prevPer.dep?`${ys.dep>prevPer.dep?'+':''}${fmt0(ys.dep-prevPer.dep)} vs ${y-1}${lastM<12?' (même période)':''}`:'&nbsp;'}</div></div>
    <div class="card kpi"><div class="k">Revenus</div><div class="v good">${fmt0(ys.rev)}</div><div class="d muted">${prevPer.rev?`${fmt0(prevPer.rev)} en ${y-1}`:'&nbsp;'}</div></div>
    <div class="card kpi"><div class="k">Épargne nette</div><div class="v" style="color:${cat('epargne').color}">${fmt0(ys.epa)}</div><div class="d muted">${ys.rev?pct(ys.epa,ys.rev)+' % des revenus':''}</div></div>
    <div class="card kpi"><div class="k">Dépenses / mois</div><div class="v">${fmt0(ys.dep/active)}</div><div class="d muted">moyenne sur ${active} mois</div></div>
  </div>
  <div class="card sec"><h3>Dépenses par mois<span class="sp"></span><span class="muted" style="font-size:.8em;font-weight:600">pointillés = revenus · touche un mois pour l'ouvrir</span></h3>
    ${stackedSVG(MOIS_C, series, {keys, line:{values:keys.map(k=>Math.max(0,monthSums(k,A).rev)), color:cat('revenu').color}})}
    <div class="filters" style="margin-top:12px">${depCats().map(c=>`<button class="chip ${V.hidden.has(c.id)?'':'on'}" style="${V.hidden.has(c.id)?'':`background:${c.color};color:${luminance(c.color)>.6?'#17142B':'#fff'}`}" data-act="toggleCat" data-c="${c.id}">${esc(c.name)}</button>`).join('')}</div>
  </div>
  <div class="card sec"><h3>Les mois de ${y}</h3><div class="mtiles">${keys.map(k=>{ const s=monthSums(k,A); const has=(idx().byMonth[k]||[]).length;
    return `<div class="mtile" data-act="goMonth" data-k="${k}" style="${has?'':'opacity:.45'}"><div class="t">${MOIS[monOf(k)-1]}</div><div class="v">${has?fmt0(s.dep):'—'}</div>
      <div class="stack">${depCats().map(c=>`<i style="flex:${Math.max(0,s.by[c.id]||0)};background:${c.color}"></i>`).join('')}</div></div>`; }).join('')}</div></div>
  <div class="card sec"><h3>Tableau récapitulatif</h3>${pivotTable(y,A)}</div>`;
}
function pivotRows(y,A){
  const keys=[...Array(12)].map((_,i)=>mkey(y,i+1)); const ms=keys.map(k=>monthSums(k,A));
  const active=keys.filter(k=>(idx().byMonth[k]||[]).length).length||1;
  const rows=S.cats.filter(c=>c.kind!=='virement').map(c=>{ const vals=ms.map(s=>r2(s.by[c.id]||0)); const tot=r2(vals.reduce((a,b)=>a+b,0)); return {c, vals, tot, avg:tot/active}; }).filter(r=>r.tot);
  const depTot=ms.map(s=>s.dep);
  return {rows, depTot, keys, active, ms};
}
function pivotTable(y,A){
  const {rows,depTot,active,ms}=pivotRows(y,A);
  const cell=v=>v?fmt0(v):'<span class="muted">·</span>';
  return `<div class="scroll"><table class="pivot"><thead><tr><th>Catégorie</th>${MOIS_C.map(m=>`<th class="n">${m}</th>`).join('')}<th class="n">Total</th><th class="n">Moy./mois</th></tr></thead><tbody>
  ${rows.filter(r=>r.c.kind==='depense').map(r=>`<tr><td><span class="dot" style="background:${r.c.color}"></span> ${esc(r.c.name)}</td>${r.vals.map(v=>`<td class="n">${cell(v)}</td>`).join('')}<td class="n"><b>${fmt0(r.tot)}</b></td><td class="n">${fmt0(r.avg)}</td></tr>`).join('')}
  <tr class="tot"><td>Total dépenses</td>${depTot.map(v=>`<td class="n">${cell(v)}</td>`).join('')}<td class="n">${fmt0(depTot.reduce((a,b)=>a+b,0))}</td><td class="n">${fmt0(depTot.reduce((a,b)=>a+b,0)/active)}</td></tr>
  ${rows.filter(r=>r.c.kind!=='depense').map(r=>`<tr><td><span class="dot" style="background:${r.c.color}"></span> ${esc(r.c.name)}</td>${r.vals.map(v=>`<td class="n">${cell(v)}</td>`).join('')}<td class="n"><b>${fmt0(r.tot)}</b></td><td class="n">${fmt0(r.avg)}</td></tr>`).join('')}
  <tr class="tot"><td>Reste</td>${ms.map(s=>`<td class="n ${s.reste<0?'bad':''}">${(s.rev||s.dep)?fmt0(s.reste):'<span class="muted">·</span>'}</td>`).join('')}<td class="n">${fmt0(ms.reduce((a,s)=>a+s.reste,0))}</td><td></td></tr>
  </tbody></table></div>`;
}

/* ================= COMPARER ================= */
function cmpDefaults(){
  const C=V.cmp;
  if(C.mode==='mois'){ if(!C.a||C.a.length!==7) C.a=V.k; if(!C.b||C.b.length!==7) C.b=prevKey(C.a); }
  else { if(!C.a||C.a.length!==4) C.a=String(V.y); if(!C.b||C.b.length!==4) C.b=String(+C.a-1); }
}
function periodSums(p, A){ return p.length===4? sumsYear(+p, A) : monthSums(p, A); }
const periodName = p => p.length===4? p : monthName(p);
function cmpRows(){
  const C=V.cmp, A=V.accF, sa=periodSums(C.a,A), sb=periodSums(C.b,A);
  const rows=S.cats.filter(c=>c.kind==='depense'||c.kind==='epargne').map(c=>({id:c.id,label:c.name,color:c.color,a:Math.max(0,r2(sa.by[c.id]||0)),b:Math.max(0,r2(sb.by[c.id]||0))})).filter(r=>r.a||r.b);
  return {rows, sa, sb};
}
function evoData(){
  const E=V.evo, A=V.accF, keys=idx().sorted.filter(k=>(idx().byMonth[k]||[]).length);
  const val = k => { const s=monthSums(k,A); return E.metric==='__dep'?s.dep: E.metric==='__rev'?s.rev: E.metric==='__epa'?s.epa: E.metric==='__reste'?s.reste: (s.by[E.metric]||0); };
  const color = E.metric.startsWith('__') ? ({__dep:'var(--accent)',__rev:cat('revenu').color,__epa:cat('epargne').color,__reste:'#6E6A85'})[E.metric] : cat(E.metric).color;
  return {keys, val, color};
}
const YEAR_COLORS=['#B8B5C9','#8E8AA8','#5B4FE9','#ED7D31','#12A4B5','#E5484D'];
function viewCompare(){
  cmpDefaults(); const C=V.cmp, E=V.evo;
  const monthsOpts=idx().sorted.slice().reverse(), yearsOpts=allYears();
  const opts = (sel) => (C.mode==='mois'? monthsOpts.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${monthName(k)}</option>`) : yearsOpts.map(y=>`<option value="${y}" ${String(y)===sel?'selected':''}>${y}</option>`)).join('');
  const {rows,sa,sb}=cmpRows();
  const {keys,val,color}=evoData();
  let evoSvg='';
  if(E.mode==='years'){
    const ys=[...new Set(keys.map(yearOf))].sort();
    evoSvg=linesSVG(MOIS_C, ys.map((y,i)=>({name:y, color: i===ys.length-1? (color.startsWith('var')?S.settings.accent:color) : YEAR_COLORS[i%YEAR_COLORS.length], width:i===ys.length-1?3.4:2.2, values:[...Array(12)].map((_,m)=>{ const k=mkey(y,m+1); return (idx().byMonth[k]||[]).length? Math.max(0,val(k)) : null; })})));
    evoSvg+=`<div class="filters" style="margin-top:10px">${ys.map((y,i)=>`<span class="chip"><span class="dot" style="background:${i===ys.length-1?(color.startsWith('var')?S.settings.accent:color):YEAR_COLORS[i%YEAR_COLORS.length]}"></span>${y} · moy. ${fmt0(avgOf(keys.filter(k=>yearOf(k)===y).map(val)))}</span>`).join('')}</div>`;
  } else {
    evoSvg=linesSVG(keys.map(k=>MOIS_C[monOf(k)-1].replace('.','')+' '+String(yearOf(k)).slice(2)), [{name:'', color: color.startsWith('var')?S.settings.accent:color, values:keys.map(k=>Math.max(0,val(k)))}], {area:true});
  }
  const metricOpts=[['__dep','Total des dépenses'],['__rev','Revenus'],['__epa','Épargne'],['__reste','Reste'],...S.cats.filter(c=>c.kind==='depense').map(c=>[c.id,c.name])];
  // moyennes mensuelles par année
  const ys=allYears().slice().reverse();
  const avgTable=`<div class="scroll"><table class="pivot"><thead><tr><th>Moyenne / mois</th>${ys.map(y=>`<th class="n">${y}</th>`).join('')}</tr></thead><tbody>
    ${[...depCats(), cat('epargne'), cat('revenu')].map(c=>`<tr><td><span class="dot" style="background:${c.color}"></span> ${esc(c.name)}</td>${ys.map(y=>{ const ks=monthsOfYear(y).filter(k=>(idx().byMonth[k]||[]).length); const v=avgOf(ks.map(k=>monthSums(k,V.accF).by[c.id]||0)); return `<td class="n">${v?fmt0(v):'<span class="muted">·</span>'}</td>`; }).join('')}</tr>`).join('')}
    <tr class="tot"><td>Total dépenses</td>${ys.map(y=>{ const ks=monthsOfYear(y).filter(k=>(idx().byMonth[k]||[]).length); return `<td class="n">${fmt0(avgOf(ks.map(k=>monthSums(k,V.accF).dep)))}</td>`; }).join('')}</tr></tbody></table></div>`;
  return `
  <div class="top"><h1>Comparer</h1><span class="sp"></span><button class="btn" data-act="pdf" data-kind="compare">${I.pdf}PDF</button></div>
  ${accFilterChips()}
  <div class="card"><h3>Deux périodes côte à côte<span class="sp"></span><div class="seg"><button class="${C.mode==='mois'?'on':''}" data-act="cmpMode" data-m="mois">Mois</button><button class="${C.mode==='annee'?'on':''}" data-act="cmpMode" data-m="annee">Années</button></div></h3>
    <div class="row2" style="margin-bottom:14px"><select data-chg="cmpA">${opts(C.a)}</select><span style="flex:0;min-width:0" class="muted">vs</span><select data-chg="cmpB">${opts(C.b)}</select>
    ${C.mode==='mois'?`<button class="btn sm ghost" style="flex:0" data-act="cmpQuick" data-q="prev">Mois d'avant</button><button class="btn sm ghost" style="flex:0" data-act="cmpQuick" data-q="ly">Il y a 1 an</button>`:''}</div>
    ${rows.length?compareSVG(rows,{la:periodName(C.a), lb:periodName(C.b)}):'<div class="empty">Pas de données sur ces périodes.</div>'}
    <div class="scroll" style="margin-top:12px"><table><thead><tr><th>Catégorie</th><th class="n">${esc(periodName(C.a))}</th><th class="n">${esc(periodName(C.b))}</th><th class="n">Écart</th><th class="n"></th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><span class="dot" style="background:${r.color}"></span> ${esc(r.label)}</td><td class="n"><b>${fmt(r.a)}</b></td><td class="n">${fmt(r.b)}</td><td class="n ${r.a>r.b?'bad':'good'}">${r.a>r.b?'+':''}${fmt(r.a-r.b)}</td><td class="n">${deltaBadge(r.a,r.b, r.id!=='epargne')}</td></tr>`).join('')}
    <tr class="tot"><td><b>Total dépenses</b></td><td class="n"><b>${fmt(sa.dep)}</b></td><td class="n">${fmt(sb.dep)}</td><td class="n ${sa.dep>sb.dep?'bad':'good'}">${sa.dep>sb.dep?'+':''}${fmt(sa.dep-sb.dep)}</td><td class="n">${deltaBadge(sa.dep,sb.dep)}</td></tr>
    <tr><td>Revenus</td><td class="n">${fmt(sa.rev)}</td><td class="n">${fmt(sb.rev)}</td><td class="n">${sa.rev>sb.rev?'+':''}${fmt(sa.rev-sb.rev)}</td><td class="n">${deltaBadge(sa.rev,sb.rev,false)}</td></tr>
    </tbody></table></div>
  </div>
  <div class="card sec"><h3>Évolution dans le temps<span class="sp"></span><div class="seg"><button class="${E.mode==='years'?'on':''}" data-act="evoMode" data-m="years">Années superposées</button><button class="${E.mode==='all'?'on':''}" data-act="evoMode" data-m="all">Tout l'historique</button></div></h3>
    <div style="max-width:320px;margin-bottom:12px"><select data-chg="evoMetric">${metricOpts.map(([v,l])=>`<option value="${v}" ${v===E.metric?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
    ${evoSvg}
  </div>
  <div class="card sec"><h3>Moyennes mensuelles par année</h3>${avgTable}</div>`;
}
function avgOf(a){ return a.length? a.reduce((x,y)=>x+y,0)/a.length : 0; }

let E=null;
function openEntry(t){
  const k=V.k, today=todayISO();
  if(t){
    E={id:t.id, dir:t.dir, total:numStr(t.amount), label:t.label, date:t.date, acc:t.acc, split:t.splits.length>1,
       cat:t.splits[0]?.cat, splits:t.splits.length>1?t.splits.map(s=>({cat:s.cat,val:numStr(s.amount)})):[], restCat:S.settings.restCat, focus:'total', fresh:true};
  } else {
    const date = (E&&E.chain&&E.lastDate&&keyOf(E.lastDate)===k) ? E.lastDate : keyOf(today)===k ? today : k+'-01';
    E={id:null, dir:E?.keepDir||'out', total:'', label:'', date, acc:E?.lastAcc||S.settings.defaultAcc||S.accs[0]?.id, split:false, cat:null, splits:[], restCat:S.settings.restCat, focus:'total', fresh:true};
  }
  drawSheet();
}
function closeSheet(){ const o=document.getElementById('ov'); if(o) o.remove(); E&& (E.open=false); document.removeEventListener('keydown', keyHandler); }
function entryCats(){
  const order = E.dir==='out' ? ['depense','epargne','virement'] : ['revenu','virement','epargne','depense'];
  return order.flatMap(k=>S.cats.filter(c=>c.kind===k));
}
function splitSum(){ return r2(E.splits.reduce((s,x)=>s+parseNum(x.val),0)); }
function drawSheet(){
  let o=document.getElementById('ov');
  if(!o){ o=document.createElement('div'); o.id='ov'; o.className='overlay'; document.body.appendChild(o); o.addEventListener('click',e=>{ if(e.target===o) closeSheet(); }); document.addEventListener('keydown', keyHandler); }
  E.open=true;
  const total=parseNum(E.total), rest=r2(total-splitSum());
  const accs=S.accs.filter(a=>!a.hidden || a.id===E.acc);
  o.innerHTML=`<div class="sheet" role="dialog">
    <div class="sh-h"><button class="btn ghost sm" data-act="closeSheet">Annuler</button><h2>${E.id?'Modifier':'Nouvelle'} ${E.dir==='out'?'dépense':'entrée'}</h2><button class="btn pri sm" data-act="saveTx">Enregistrer</button></div>
    <div class="sh-b">
      <div>
        <div class="seg" style="margin-bottom:14px"><button class="${E.dir==='out'?'on':''}" data-act="eDir" data-d="out">Dépense</button><button class="${E.dir==='in'?'on':''}" data-act="eDir" data-d="in">Entrée d'argent</button></div>
        <div class="amount ${E.focus==='total'?'focus':''}" data-act="eFocus" data-f="total">${E.total?esc(E.total):'<span class="muted">0</span>'}<small>€ ${E.split?'· total du ticket':''}</small></div>
        <div class="lbl2">Libellé</div>
        <input id="elabel" value="${esc(E.label)}" placeholder="Ex. Lidl, Essence, Loyer…" data-inp="elabel" autocomplete="off" enterkeyhint="done">
        <div class="sugg" id="sugg">${suggHTML()}</div>
        <div class="row2" style="margin-top:6px">
          <div><div class="lbl2">Date</div><input type="date" value="${E.date}" data-chg="edate"></div>
          <div><div class="lbl2">Compte</div><select data-chg="eacc">${accs.map(a=>`<option value="${a.id}" ${a.id===E.acc?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
        </div>
        <div class="lbl2" style="display:flex;align-items:center">${E.split?'Ajoute une ligne par couleur':'Catégorie'}<span style="flex:1"></span>
          ${E.dir==='out'?`<button class="btn sm ${E.split?'pri':'ghost'}" data-act="eSplit">${E.split?'✓ Ticket divisé':'Diviser le ticket'}</button>`:''}</div>
        <div class="cats">${entryCats().map(c=>`<button class="cat ${(!E.split&&E.cat===c.id)?'on':''}" style="--c:${c.color}" data-act="eCat" data-c="${c.id}"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')}</div>
        ${E.split?`<div class="splits">${E.splits.map((s,i)=>`<div class="spl ${E.focus===i?'focus':''}" data-act="eFocus" data-f="${i}"><span class="dot" style="background:${cat(s.cat).color}"></span><span>${esc(cat(s.cat).name)}</span><span class="v">${s.val?esc(s.val):'<span class="muted">0</span>'} €</span><button class="iconbtn" style="width:34px;height:34px;box-shadow:none" data-act="eDelSplit" data-i="${i}">${I.x}</button></div>`).join('')}
          <div class="spl rest"><span class="dot" style="background:${cat(E.restCat).color}"></span><span>Le reste va dans <select data-chg="erest">${S.cats.filter(c=>c.kind==='depense').map(c=>`<option value="${c.id}" ${c.id===E.restCat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></span><span class="v ${rest<0?'bad':''}">${fmt(rest)}</span><span></span></div>
          </div>`:''}
        <div class="err" id="eerr"></div>
      </div>
      <div class="keypad">${['7','8','9','4','5','6','1','2','3',',','0','⌫'].map(k=>`<button data-act="key" data-k="${k}">${k}</button>`).join('')}
        <button class="ok" data-act="saveNext">Enregistrer et en saisir un autre</button></div>
    </div>
    <div class="sh-f">${E.id?`<button class="btn danger ghost" data-act="delTx">Supprimer</button>`:''}<span class="sp"></span><span class="muted" style="align-self:center;font-size:.85em">${E.id?'':'Astuce : touche une suggestion pour tout pré-remplir'}</span></div>
  </div>`;
}
function suggHTML(){
  const q=cleanLabel(E.label).toLowerCase();
  let L=labelIndex().filter(e=>e.dir===E.dir);
  if(q) L=L.filter(e=>e.label.toLowerCase().startsWith(q) || e.label.toLowerCase().includes(' '+q));
  L=L.sort((a,b)=> (b.n + (b.last>'2026'?5:0)) - (a.n + (a.last>'2026'?5:0))).slice(0, q?6:8);
  if(q && L.length===1 && L[0].label.toLowerCase()===q) return '';
  return L.map(e=>`<button data-act="eSugg" data-l="${esc(e.label)}"><span class="dot" style="background:${cat(e.cat).color}"></span>${esc(e.label)}</button>`).join('');
}
function applySugg(label){
  const e=labelIndex().find(x=>x.label===label); E.label=label;
  if(e){ if(e.acc && S.accs.find(a=>a.id===e.acc)) E.acc=e.acc; if(!E.split && e.cat) E.cat=e.cat;
    const kind=cat(e.cat).kind; if(!E.total && (kind!=='depense' || e.cat==='oblig')) E.total=numStr(e.amount); }
  drawSheet();
}
function keyPress(k){
  const get=()=> E.focus==='total'? E.total : (E.splits[E.focus]?.val||'');
  const set=v=>{ if(E.focus==='total') E.total=v; else if(E.splits[E.focus]) E.splits[E.focus].val=v; };
  let v=E.fresh && E.focus==='total' && E.id ? '' : get(); E.fresh=false;
  if(k==='⌫') v=v.slice(0,-1);
  else if(k===','){ if(!v.includes(',')) v=(v||'0')+','; }
  else { if(/,\d\d$/.test(v)) return; if(v==='0') v=''; if(v.replace(',','').length>=8) return; v+=k; }
  set(v); drawSheet();
}
function keyHandler(e){
  if(!E||!E.open) return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Escape'){ closeSheet(); return; }
  if(tag==='input'||tag==='select'){ if(e.key==='Enter' && e.target.id==='elabel'){ e.target.blur(); } return; }
  if(/^[0-9]$/.test(e.key)) { keyPress(e.key); e.preventDefault(); }
  else if(e.key===','||e.key==='.') { keyPress(','); e.preventDefault(); }
  else if(e.key==='Backspace') { keyPress('⌫'); e.preventDefault(); }
  else if(e.key==='Enter') { saveEntry(false); e.preventDefault(); }
}
function saveEntry(next){
  const err=m=>{ const el=document.getElementById('eerr'); if(el) el.textContent=m; };
  const total=r2(parseNum(E.total));
  if(!(total>0)) return err('Indique un montant.');
  if(!E.label.trim()) return err('Indique un libellé (ex. Lidl).');
  let splits;
  if(E.split){
    splits=E.splits.map(s=>({cat:s.cat, amount:r2(parseNum(s.val))})).filter(s=>s.amount>0);
    const rest=r2(total-splits.reduce((a,b)=>a+b.amount,0));
    if(rest<-0.004) return err('Les montants dépassent le total du ticket.');
    if(rest>0) { const ex=splits.find(s=>s.cat===E.restCat); if(ex) ex.amount=r2(ex.amount+rest); else splits.push({cat:E.restCat, amount:rest}); }
    if(!splits.length) return err('Ajoute au moins une catégorie.');
  } else {
    if(!E.cat) return err('Choisis une catégorie (une couleur).');
    splits=[{cat:E.cat, amount:total}];
  }
  const t={id:E.id||uid(), date:E.date, acc:E.acc, label:E.label.trim(), dir:E.dir, amount:total, splits};
  let oldKey=null;
  if(E.id){ const i=S.tx.findIndex(x=>x.id===E.id); if(i>=0){ oldKey=keyOf(S.tx[i].date); S.tx[i]=t; } } else S.tx.push(t);
  changed(keyOf(t.date), oldKey);
  const keep={lastAcc:E.acc, lastDate:E.date, keepDir:E.dir};
  toast(E.id?'Modifié ✓':'Enregistré ✓');
  if(keyOf(t.date)!==V.k && V.view==='mois'){ V.k=keyOf(t.date); V.open.add(yearOf(V.k)); }
  render();
  if(next){ E={...keep, chain:true}; openEntry(null); }
  else { closeSheet(); E={lastAcc:keep.lastAcc}; }
}

/* ---------- petites fenêtres ---------- */
function modal(title, body, buttons){
  closeSheet();
  const o=document.createElement('div'); o.id='ov'; o.className='overlay';
  o.innerHTML=`<div class="sheet narrow"><div class="sh-h"><h2 style="text-align:left">${title}</h2><button class="iconbtn" style="box-shadow:none" data-act="closeSheet">${I.x}</button></div><div class="sh-b one">${body}</div><div class="sh-f"><span class="sp"></span>${buttons}</div></div>`;
  o.addEventListener('click',e=>{ if(e.target===o) closeSheet(); });
  document.body.appendChild(o);
  return o;
}
function toast(m){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function confirmBox(title, text, okLabel, onOk, danger){
  const o=modal(title, `<p style="margin:0">${text}</p>`, `<button class="btn ghost" data-act="closeSheet">Annuler</button><button class="btn ${danger?'danger':'pri'}" id="cOk">${okLabel}</button>`);
  o.querySelector('#cOk').onclick=()=>{ closeSheet(); onOk(); };
}
function askText(title, label, value, onOk, numeric){
  const o=modal(title, `<div class="lbl2" style="margin-top:0">${label}</div><input id="askv" value="${esc(value)}" ${numeric?'inputmode="decimal"':''}>`, `<button class="btn ghost" data-act="closeSheet">Annuler</button><button class="btn pri" id="cOk">OK</button>`);
  const inp=o.querySelector('#askv'); setTimeout(()=>inp.focus(),50);
  const go=()=>{ const v=inp.value; closeSheet(); onOk(v); };
  o.querySelector('#cOk').onclick=go; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}

/* charges fixes : reprend les opérations récurrentes du mois précédent */
function openFixed(){
  const k=V.k, pk=prevKey(k), ppk=prevKey(pk);
  const here=new Set(txOf(k).map(t=>cleanLabel(t.label).toLowerCase()));
  const before=new Set(txOf(ppk).map(t=>cleanLabel(t.label).toLowerCase()));
  const cands=txOf(pk).filter(t=>{ const l=cleanLabel(t.label).toLowerCase(); if(here.has(l)) return false;
    const kinds=t.splits.map(s=>s.cat); return kinds.includes('oblig')||kinds.includes('epargne')||(t.dir==='in'&&kinds.includes('revenu')&&before.has(l))||before.has(l)&&cat(kinds[0]).kind!=='depense'; });
  const uniq=[]; const seen=new Set(); for(const t of cands){ const l=cleanLabel(t.label).toLowerCase()+t.acc+t.dir; if(!seen.has(l)){ seen.add(l); uniq.push(t);} }
  if(!uniq.length){ toast('Rien à reprendre depuis '+MOIS[monOf(pk)-1].toLowerCase()); return; }
  const body=`<p class="muted" style="margin-top:0">Opérations récurrentes de ${MOIS[monOf(pk)-1].toLowerCase()} à recopier dans ${MOIS[monOf(k)-1].toLowerCase()}. Ajuste les montants si besoin.</p>
  <div class="checks">${uniq.map((t,i)=>`<label><input type="checkbox" data-i="${i}" ${before.has(cleanLabel(t.label).toLowerCase())?'checked':''}><span><span class="dot" style="background:${cat(t.splits[0].cat).color}"></span> ${esc(cleanLabel(t.label))} <span class="muted" style="font-size:.85em">· ${esc(acc(t.acc).name)} · le ${+t.date.slice(8)}</span></span><input type="text" inputmode="decimal" value="${numStr(t.amount)}" data-amt="${i}"></label>`).join('')}</div>`;
  const o=modal('Charges fixes du mois', body, `<button class="btn ghost" data-act="closeSheet">Annuler</button><button class="btn pri" id="cOk">Ajouter la sélection</button>`);
  o.querySelector('#cOk').onclick=()=>{
    let n=0; const last=new Date(yearOf(k), monOf(k), 0).getDate();
    o.querySelectorAll('input[type=checkbox]').forEach(cb=>{ if(!cb.checked) return; const i=+cb.dataset.i, t=uniq[i];
      const amt=r2(parseNum(o.querySelector(`[data-amt="${i}"]`).value)); if(!(amt>0)) return;
      const k2=t.amount? amt/t.amount : 1;
      const splits=t.splits.map(s=>({cat:s.cat, amount:r2(s.amount*k2)})); const diff=r2(amt-splits.reduce((a,b)=>a+b.amount,0)); splits[0].amount=r2(splits[0].amount+diff);
      S.tx.push({id:uid(), date:`${k}-${pad(Math.min(+t.date.slice(8), last))}`, acc:t.acc, label:cleanLabel(t.label), dir:t.dir, amount:amt, splits}); n++; });
    closeSheet(); changed(k); render(); toast(n+' opération'+(n>1?'s':'')+' ajoutée'+(n>1?'s':''));
  };
}

/* ================= ACTIONS ================= */
const ACT = {
  nav:a=>{ V.view=a.dataset.v; V.catF=null; render(); window.scrollTo(0,0); },
  toggleYear:a=>{ const y=+a.dataset.y; V.open.has(y)?V.open.delete(y):V.open.add(y); a.parentElement.classList.toggle('open'); },
  goMonth:a=>{ V.k=a.dataset.k; V.view='mois'; V.catF=null; V.q=''; V.open.add(yearOf(V.k)); render(); window.scrollTo(0,0); },
  goYear:a=>{ V.y=+a.dataset.y; V.view='annee'; V.open.add(V.y); render(); },
  shiftMonth:a=>{ V.k = a.dataset.d==='1'? nextKey(V.k) : prevKey(V.k); V.catF=null; V.open.add(yearOf(V.k)); render(); },
  accF:a=>{ const id=a.dataset.a; if(!id) V.accF=null; else { let s=new Set(V.accF||[]); s.has(id)?s.delete(id):s.add(id); V.accF=s.size?[...s]:null; } rerenderMain(); },
  catF:a=>{ V.catF = V.catF===a.dataset.c ? null : a.dataset.c; rerenderMain(); },
  toggleCat:a=>{ const c=a.dataset.c; V.hidden.has(c)?V.hidden.delete(c):V.hidden.add(c); rerenderMain(); },
  newTx:()=>{ openEntry(null); },
  editTx:a=>{ const t=S.tx.find(x=>x.id===a.dataset.id); if(t) openEntry(t); },
  closeSheet:()=>closeSheet(),
  eDir:a=>{ E.dir=a.dataset.d; E.cat=null; E.split=false; E.splits=[]; drawSheet(); },
  eFocus:a=>{ const f=a.dataset.f; E.focus = f==='total'?'total':+f; E.fresh=false; drawSheet(); },
  eCat:a=>{ const c=a.dataset.c;
    if(E.split){ E.splits.push({cat:c, val:''}); E.focus=E.splits.length-1; }
    else E.cat=c;
    drawSheet(); },
  eSplit:()=>{ E.split=!E.split; if(E.split){ E.splits = E.cat? [{cat:E.cat,val:''}] : []; E.focus = E.splits.length? 0 : 'total'; if(E.cat) E.restCat = S.settings.restCat; } else { E.splits=[]; E.focus='total'; } drawSheet(); },
  eDelSplit:(a,e)=>{ e.stopPropagation(); E.splits.splice(+a.dataset.i,1); E.focus='total'; drawSheet(); },
  eSugg:a=>applySugg(a.dataset.l),
  key:a=>keyPress(a.dataset.k),
  saveTx:()=>saveEntry(false),
  saveNext:()=>saveEntry(true),
  delTx:()=>{ const id=E.id; const t=S.tx.find(x=>x.id===id); confirmBox('Supprimer ?', `« ${esc(t.label)} » (${fmt(t.amount)}) sera supprimé.`, 'Supprimer', ()=>{ S.tx=S.tx.filter(x=>x.id!==id); changed(keyOf(t.date)); render(); toast('Supprimé'); }, true); },
  fixed:()=>openFixed(),
  editOpening:a=>{ const id=a.dataset.a, k=V.k; askText(`Solde de début · ${esc(acc(id).name)}`, `Solde au 1<sup>er</sup> ${MOIS[monOf(k)-1].toLowerCase()} (laisse vide pour reprendre automatiquement la fin du mois précédent)`, S.months[k]?.openings?.[id]!=null?numStr(S.months[k].openings[id]):'', v=>{
      S.months[k] ||= {openings:{}}; S.months[k].openings ||= {};
      if(String(v).trim()==='') delete S.months[k].openings[id]; else S.months[k].openings[id]=r2(parseNum(v));
      changed(k); render(); }, true); },
  pdf:a=>exportPDF(a.dataset.kind),
  cmpMode:a=>{ V.cmp={mode:a.dataset.m,a:null,b:null}; rerenderMain(); },
  cmpQuick:a=>{ cmpDefaults(); V.cmp.b = a.dataset.q==='prev'? prevKey(V.cmp.a) : mkey(yearOf(V.cmp.a)-1, monOf(V.cmp.a)); rerenderMain(); },
  evoMode:a=>{ V.evo.mode=a.dataset.m; rerenderMain(); },
  setTheme:a=>{ S.settings.theme=a.dataset.v; changed('meta'); applyTheme(); render(); },

function downloadBlob(blob, name){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000); }
let READY=null;
async function shareFile(blob, name){
  READY={blob,name};
  const canShare = !!(navigator.canShare && navigator.canShare({files:[new File([blob],name,{type:blob.type})]}));
  modal('Fichier prêt', `<p style="margin:0"><b>${esc(name)}</b></p><p class="muted">${canShare?'« Partager » permet de l’enregistrer dans Fichiers, de l’envoyer par mail ou de l’imprimer.':'Télécharge-le ou ouvre-le dans un nouvel onglet.'}</p>`,
    `${canShare?`<button class="btn pri" data-act="shareReady">Partager / Enregistrer</button>`:''}<button class="btn" data-act="dlReady">Télécharger</button>${blob.type==='application/pdf'?`<button class="btn ghost" data-act="openReady">Ouvrir</button>`:''}`);
}
async function doShare(){ if(!READY) return; try{ await navigator.share({files:[new File([READY.blob],READY.name,{type:READY.blob.type})], title:READY.name}); closeSheet(); }catch(e){ if(e.name!=='AbortError') downloadBlob(READY.blob, READY.name); } }

'use strict';
const P = s => String(s??'').replace(/[  ]/g,' ').replace(/−/g,'-').replace(/[^\x00-ɏ€’‘“”…·•–—]/g,'').trim();
const rgb = hex => { const n=parseInt((hex||'#999').slice(1),16); return [n>>16&255, n>>8&255, n&255]; };
const fP = v => P(fmt(v)), f0 = v => P(fmt0(v));

function pdfHeader(doc, title, sub){
  const W=doc.internal.pageSize.getWidth();
  doc.setFillColor(...rgb(S.settings.accent)); doc.rect(0,0,W,30,'F');
  const ink = luminance(S.settings.accent)>.6 ? [23,20,43] : [255,255,255];
  doc.setTextColor(...ink); doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.text(P(title),14,15);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.text(P(sub),14,23);
  doc.text(P('Mes comptes · '+new Date().toLocaleDateString('fr-FR')), W-14, 23, {align:'right'});
  doc.setTextColor(23,20,43);
  return 40;
}
function pdfKpis(doc, y, items){
  const W=doc.internal.pageSize.getWidth(), gap=4, w=(W-28-gap*(items.length-1))/items.length;
  items.forEach((it,i)=>{ const x=14+i*(w+gap);
    doc.setFillColor(246,245,250); doc.roundedRect(x,y,w,22,3,3,'F');
    doc.setFontSize(8.5); doc.setTextColor(110,106,133); doc.setFont('helvetica','normal'); doc.text(P(it[0]),x+4,y+7);
    doc.setFontSize(14); doc.setFont('helvetica','bold'); doc.setTextColor(...(it[2]?rgb(it[2]):[23,20,43])); doc.text(P(it[1]),x+4,y+16);
  });
  doc.setTextColor(23,20,43); return y+28;
}
function pdfTitle(doc, y, t){
  if(y>doc.internal.pageSize.getHeight()-30){ doc.addPage(); y=18; }
  doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(23,20,43); doc.text(P(t),14,y); return y+4;
}
const TBL = (doc, opts) => { doc.autoTable(Object.assign({
  theme:'plain', styles:{font:'helvetica', fontSize:9, cellPadding:{top:1.8,bottom:1.8,left:2,right:2}, textColor:[23,20,43], lineColor:[230,228,238], lineWidth:{bottom:.2}},
  headStyles:{fontStyle:'bold', textColor:[110,106,133], fontSize:8, fillColor:[246,245,250]},
  margin:{left:14,right:14}}, opts)); return doc.lastAutoTable.finalY+8; };

async function exportPDF(kind){
  if(!window.jspdf){ toast('Module PDF indisponible'); return; }
  toast('Préparation du PDF…');
  try{
    const {jsPDF}=window.jspdf; let doc, name;
    if(kind==='year'){ doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true}); await pdfYear(doc); name=`Bilan-${V.y}.pdf`; }
    else if(kind==='compare'){ doc=new jsPDF({unit:'mm',format:'a4',compress:true}); await pdfCompare(doc); name=`Comparaison-${V.cmp.a}-${V.cmp.b}.pdf`; }
    else { doc=new jsPDF({unit:'mm',format:'a4',compress:true}); await pdfMonth(doc); name=`${MOIS[monOf(V.k)-1]}-${yearOf(V.k)}.pdf`; }
    const n=doc.internal.getNumberOfPages();
    for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(150,146,170); doc.text(`${i} / ${n}`, doc.internal.pageSize.getWidth()-14, doc.internal.pageSize.getHeight()-8, {align:'right'}); }
    shareFile(doc.output('blob'), name);
  }catch(e){ console.error(e); toast('Erreur PDF : '+e.message); }
}

  y=pdfTitle(doc,y,`Évolution : ${metricName} (années superposées)`);
  doc.addImage(png,'PNG',14,y+1,W-28,(W-28)*280/900,undefined,'FAST'); y+=(W-28)*280/900+6;
  let lx=14; doc.setFontSize(8.5); ys.forEach((yy,i)=>{ doc.setFillColor(...rgb(i===ys.length-1?col:YEAR_COLORS[i%YEAR_COLORS.length])); doc.rect(lx,y-2.6,3,3,'F'); doc.setTextColor(60,56,80); doc.text(String(yy),lx+4.5,y); lx+=18; });
}
</script>

loadLocal(); applyTheme(); render();
setTimeout(boot, 0);
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}
